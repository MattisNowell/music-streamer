name: Python Tests

on: [push]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install Poetry
        run: curl -sSL https://install.python-poetry.org | python3 -

      - name: Configure Poetry
        run: echo "$HOME/.poetry/bin" >> $GITHUB_PATH

      - name: Install dependencies for Account
        run: | 
            cd Account
            poetry install --no-interaction

      - name: Run tests for Account
        run: | 
            cd Account
            poetry run pytest test

      - name: Install dependencies for Player
        run: | 
            cd Player
            poetry install --no-interaction

      - name: Run tests for Player
        run: | 
            cd Player
            poetry run pytest test

      - name: Install dependencies for Playlist
        run: | 
            cd Playlist
            poetry install --no-interaction

      - name: Run tests for Playlist
        run: | 
            cd Playlist
            poetry run pytest test
